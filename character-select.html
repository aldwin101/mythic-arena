<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300..700;1,300..700&family=Uncial+Antiqua&display=swap" rel="stylesheet">

<script type="module" src="./js/interface.js" defer></script>

  <link rel="stylesheet" href="css/main.css">
  <title>Mythic Arena</title>
</head>
<body class="character-select-page">
  <div class="rotate-overlay">
      <img src="/assets/images/rotate-your-phone.gif" alt="rotate-your-phone">
    </div>
  </div>

  <main class="character-select-container">
    <h1>Select Your Champion</h1>

    <section class="character-grid">
      <div class="character-roster">
        <!-- Character cards will be dynamically inserted here -->
      </div>

      <div class="selected-character-image">
        <img src="" alt="">
        <button class="select-btn">Select</button>

      </div>

      <div class="description-box"></div>
    </section>
  </main>
</body>
</html>
