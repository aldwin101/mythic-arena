<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400..900&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Uncial+Antiqua&display=swap" rel="stylesheet">


  <link rel="stylesheet" href="css/main.css">
  <title>Mythic Arena</title>
</head>
<body class="character-select-page">
  <main class="character-select-container">
    <h1>Select Your Champion</h1>

    <section class="character-grid">
      <div class="character-roster">
        <figure class="character-container">
          <img 
            class="character-image char1"
            src="./assets/images/characters/Bravakar.png" alt="Bravakar Image">
          <figcaption>Bravakar - A strong melee fighter with high defense.</figcaption>
        </figure>
      
        <figure class="character-container">
          <img 
            class="character-image char2"
            src="./assets/images/characters/Gorblin.png" alt="Gorblin Image">
          <figcaption>Gorblin - A cunning rogue with high agility.</figcaption>
        </figure>

        <figure class="character-container">
          <img 
            class="character-image char3"
            src="./assets/images/characters/Eldramir.png" alt="Eldramir Image">
          <figcaption>Eldramir - A wise mage with powerful spells.</figcaption>
        </figure>
        
        <figure class="character-container">
          <img 
            class="character-image char4"
            src="./assets/images/characters/Moonclaw.png" alt="Moonclaw Image">
          <figcaption>Moonclaw - A swift rogue with high agility.</figcaption>
        </figure>

        <figure class="character-container">
          <img 
            class="character-image char5"
            src="./assets/images/characters/Gorunox.png" alt="Gorunox Image">
          <figcaption>Gorunox - A fierce warrior with unmatched strength.</figcaption>
        </figure>
      
        <figure class="character-container">
          <img 
            class="character-image char6"
            src="./assets/images/characters/Steamforge.png" alt="Steamforge Image">
          <figcaption>Steamforge - A mechanical genius with powerful gadgets.</figcaption>
        </figure>

        <figure class="character-container">
          <img 
            class="character-image char7"
            src="./assets/images/characters/Sir Valor.png" alt="Sir Valor Image">
          <figcaption>Sir Valor - A noble knight with exceptional combat skills.</figcaption>
        </figure>
        
        <figure class="character-container">
          <img 
            class="character-image char8"
            src="./assets/images/characters/Galaxion.png" alt="Galaxion Image">
          <figcaption>Galaxion - A cosmic warrior with incredible power.</figcaption>
        </figure>

        <figure class="character-container">
          <img 
            class="character-image char9"
            src="./assets/images/characters/Darkblade.png" alt="Darkblade Image">
          <figcaption>Darkblade - A shadowy assassin with deadly precision.</figcaption>
        </figure>
      </div>
    </section>
  </main>
</body>
</html>
