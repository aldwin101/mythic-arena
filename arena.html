<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300..700;1,300..700&family=Uncial+Antiqua&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/main.css">
  <script src="/js/arena.js" defer></script>


  <title>Mythic Arena</title>
</head>
<body class="arena-page">
  <div class='rotate-overlay'>
    <img src='/assets/images/rotate-your-phone.gif' alt='rotate-your-phone'>
  </div>
  <main class="battle-field">
    <section class="player-container">
      <p>Player</p>
      <meter
        class="player-health"
        min="0"
        max="100"
        low="30"
        high="70"
        optimum="100"
        value="100">
      </meter>
      <h2 class="player-name">
      </h2>

      <img class="player-img" src="" alt="">
    </section>

    <section class="vs-container">
      <a href="character-select.html" class="end-match-btn">
        End Match
      </a>
      <h1 class="vs-text">
        <span>V</span> <span>S</span>
      </h1>
    </section>

    <section class="enemy-container">
      <p>Enemy</p>
      <meter
        class="enemy-health"
        min="0"
        max="0"
        low="30"
        high="70"
        optimum="100"
        value="0">
      </meter>
            <h2 class="enemy-name">
      </h2>

      <img class="enemy-img" src="" alt="">

    </section>
  </main>
</body>
</html>
